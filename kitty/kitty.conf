tab_bar_style hidden

confirm_os_window_close 0

shell_integration enabled no-cursor
cursor_shape block
cursor #ffffff
cursor_text_color background

allow_remote_control no
repaint_delay 8

# Ctrl+Backspace sends the same byte as C-h (tmux navigator binds C-h), so remap
# it in the terminal: Ctrl+Backspace -> C-w (delete word back), Ctrl+Delete -> M-d (delete word forward)
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \x1bd
