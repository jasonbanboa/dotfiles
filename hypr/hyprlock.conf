general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(245, 245, 245, 1.0)
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    rounding = 16
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(245, 245, 245, 0.10)
    outer_color = rgba(122, 162, 247, 0.80)
    check_color = rgba(122, 162, 247, 0.80)
    fail_color = rgba(247, 118, 142, 0.90)
    font_color = rgb(245, 245, 245)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -20
    halign = center
    valign = center
}
